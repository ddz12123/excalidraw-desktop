name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            args: --win --x64
          - name: macos
            os: macos-latest
            args: --mac --arm64 --x64
          - name: linux-x64
            os: ubuntu-latest
            args: --linux --x64
    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm build

      - name: Package Electron app and publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec electron-builder ${{ matrix.args }} --publish always

      - name: Package Electron app without publishing
        if: github.event_name == 'workflow_dispatch'
        run: pnpm exec electron-builder ${{ matrix.args }} --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: excalidraw-${{ matrix.name }}
          path: |
            release-build/*.exe
            release-build/*.dmg
            release-build/*.zip
            release-build/*.AppImage
            release-build/*.deb
            release-build/*.blockmap
          if-no-files-found: error
